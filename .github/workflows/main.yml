name: Test and check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test_check:
    name: Test and Check
    strategy:
      matrix:
        os:
          # These are all the targets we build the tools for
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source files
        uses: actions/checkout@v6
      - name: Configure nightly rust
        run: ./scripts/set-up-nightly-ci.sh
      - name: Cargo fmt
        run: ./cargo nightly fmt --all --check
      - name: Cargo clippy
        run: |
          ./cargo nightly clippy --workspace --all-targets -- \
          --deny=warnings \
          --deny=clippy::default_trait_access \
          --deny=clippy::arithmetic_side_effects \
          --deny=clippy::manual_let_else --deny=clippy::uninlined-format-args \
          --deny=clippy::used_underscore_binding
      - name: Cargo test
        if: matrix.os == 'ubuntu-22.04'
        run: ./cargo test --workspace
      - name: Cargo test (skip alternate download)
        if: matrix.os != 'ubuntu-22.04'
        run: ./cargo test --workspace  -- --skip test_alternate_download --skip test_binaries_work

  publish_rust:
    name: Release build-sbf
    needs: test_check
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    environment: prod
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Doc and package
        working-directory: ./cargo-build-sbf
        run: |
          cargo doc
          cargo package
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe  # v1.0.4
        id: auth
      - name: Publish
        working-directory: ./cargo-build-sbf
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Generate SLSA provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26  # v4.1.0
        env:
          NODE_OPTIONS: "--max-http-header-size=32768"
        with:
          subject-path: target/package/*.crate
